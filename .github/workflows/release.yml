# Пайплайн автоматической генерации CHANGELOG на основе стандартных меток GitHub
name: Automated Release & Changelog

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build_release:
    name: Generate Changelog & Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog Markdown
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configurationJson: |
            {
              "template": "## 📦 Что изменилось в этом релизе\n\n#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "🚀 Новые возможности и улучшения (Features)",
                  "labels": ["enhancement", "feat"]
                },
                {
                  "title": "🛡️ Исправления ошибок и Edge-cases (Bug Fixes)",
                  "labels": ["bug", "fix"]
                },
                {
                  "title": "📝 Документация и конфигурация (Documentation)",
                  "labels": ["documentation"]
                }
              ],
              "ignore_labels": [
                "invalid",
                "wontfix",
                "duplicate"
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.github_release.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
