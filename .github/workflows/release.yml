# Пайплайн автоматической генерации CHANGELOG на основе стандартных меток GitHub
name: Automated Release & Changelog

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build_release:
    name: Generate Changelog & Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog Markdown
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configurationJson: |
            {
              "template": "## 📦 Что изменилось в этом релизе\n\n${changelog}",
              "categories": [
                {
                  "title": "🚀 Новые возможности и улучшения (Features)",
                  "labels": ["enhancement", "feat"],
                  "rules": [{"match": "^feat:.*", "method": "regex"}]
                },
                {
                  "title": "⚡ Оптимизация производительности (Performance)",
                  "labels": ["performance", "perf"],
                  "rules": [{"match": "^perf:.*", "method": "regex"}]
                },
                {
                  "title": "🛡️ Исправления ошибок и Edge-cases (Bug Fixes)",
                  "labels": ["bug", "fix"],
                  "rules": [{"match": "^fix:.*", "method": "regex"}]
                },
                {
                  "title": "📐 Чистая архитектура и рефакторинг (Refactor)",
                  "labels": ["refactor"],
                  "rules": [{"match": "^refactor:.*", "method": "regex"}]
                }
              ],
              "ignore_labels": [
                "documentation",
                "duplicate",
                "invalid",
                "wontfix"
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.github_release.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
